name: PlatformIO

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: pip install -U platformio

    - name: Stamp the sketch with the commit it was built from
      run: |
        sed -i -e 's|#define SKETCH_VERSION ".*"|#define SKETCH_VERSION "'$(git rev-parse --short HEAD)'"|' \
          ESP8266WirelessPrintAsync/ESP8266WirelessPrintAsync.cpp

    - name: Build
      run: pio run

    - uses: actions/upload-artifact@v4
      with:
        name: WirelessPrinting-${{ github.sha }}
        path: .pio/build/esp32dev/firmware.bin
