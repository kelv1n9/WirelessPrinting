[platformio]
src_dir = ESP8266WirelessPrintAsync
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32@3.5.0
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
board_build.partitions = partitions_nospiffs.csv
build_flags = -DLOG_LOCAL_LEVEL=ESP_LOG_NONE
extra_scripts = pre:build_version.py
; ESPAsyncWebServer and AsyncTCP are kept in lib/ rather than fetched. Two defects in
; them have to be patched and the patches have to survive a clean build: the per packet
; allocation that shreds the heap, and the counters that call data sent when the socket
; refused it. The sources there are the ones that were being fetched, commit 95dedf7 and
; release 1.1.1, with those changes on top and nothing else.
lib_deps =
	https://github.com/alanswx/ESPAsyncWiFiManager#1c02154
	https://github.com/bblanchon/ArduinoJson#3df4efd
	https://github.com/bbx10/Hash_tng
